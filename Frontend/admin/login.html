<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Kalakar</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark">Kalak<span>a</span>r</div>
    <div class="login-sub">Admin Panel</div>

    <div class="login-err" id="loginErr"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Log In</button>
    </form>

    <div class="login-foot">Store admin access only. Not a customer login.</div>
  </div>
</div>

<script>
  // If already logged in with a valid admin session, skip straight to the dashboard.
  (async function checkExisting() {
    const token = localStorage.getItem('kalakar_admin_token');
    if (!token) return;
    try {
      const res = await fetch('/api/admin/stats', { headers: { Authorization: 'Bearer ' + token } });
      if (res.ok) window.location.href = 'index.html';
    } catch (e) { /* ignore, let them log in again */ }
  })();

  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>';

    try {
      const res = await fetch('/api/users/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Login failed');
      if (!data.user || !data.user.isAdmin) throw new Error("This account doesn't have admin access.");

      localStorage.setItem('kalakar_admin_token', data.token);
      localStorage.setItem('kalakar_admin_user', JSON.stringify(data.user));
      window.location.href = 'index.html';
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  });
</script>

</body>
</html>
